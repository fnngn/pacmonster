[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pacmonster"
version = "0.9.7"
description = "Proxmox update manager"
requires-python = ">=3.11"

[project.scripts]
pacmonster = "pacmonster.main:main"

[tool.setuptools.packages.find]
include = ["pacmonster*"]
exclude = ["tests*", "tui*"]
