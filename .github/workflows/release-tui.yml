name: Release TUI binaries

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to update (defaults to the rolling latest assets)
        required: false
        default: latest
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            release_tag="$REF_NAME"
          else
            release_tag="latest"
          fi
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' tui/Cargo.toml | head -n 1)"
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$package_version" = "$project_version"
          if [[ "$release_tag" != "latest" ]]; then
            test "$release_tag" = "v$package_version"
          fi
      - name: Build TUI
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' tui/Cargo.toml | head -n 1)"
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          cargo +stable build --locked --release --target "${{ matrix.target }}" --manifest-path tui/Cargo.toml
          install -D "tui/target/${{ matrix.target }}/release/pacmonster-tui" \
            "dist/pacmonster-tui-linux-${{ matrix.architecture }}"
          ldd "dist/pacmonster-tui-linux-${{ matrix.architecture }}" | tee /tmp/pacmonster-tui-ldd.txt
          if grep -Fq 'not found' /tmp/pacmonster-tui-ldd.txt; then
            echo "The TUI binary has unresolved shared-library dependencies." >&2
            exit 1
          fi
          test "$("dist/pacmonster-tui-linux-${{ matrix.architecture }}" --version)" = \
            "pacmonster-tui $package_version"
      - uses: actions/upload-artifact@v4
        with:
          name: pacmonster-tui-${{ matrix.architecture }}
          path: dist/pacmonster-tui-linux-${{ matrix.architecture }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum pacmonster-tui-linux-* > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$REF_NAME"
          else
            RELEASE_TAG="latest"
          fi
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --clobber
          else
            notes_file="RELEASE_NOTES_${RELEASE_TAG#v}.md"
            if [[ -f "$notes_file" ]]; then
              gh release create "$RELEASE_TAG" dist/* --repo "$REPOSITORY" \
                --title "Pacmonster $RELEASE_TAG" --notes-file "$notes_file"
            else
              gh release create "$RELEASE_TAG" dist/* --repo "$REPOSITORY" \
                --title "Pacmonster $RELEASE_TAG" --generate-notes
            fi
          fi
